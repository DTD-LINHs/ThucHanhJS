<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cửa hàng thời trang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon"></span>
        <span class="logo-text">BER STORE</span>
      </div>
      <nav class="header-nav">
        <a href="#">Thời trang</a>
        <a href="#">Giày dép</a>
        <a href="#">Túi xách</a>
        <a href="#">Phụ kiện</a>
      </nav>
      <div class="header-actions">
        <button class="btn-add" id="btnOpenModal">+ Thêm sản phẩm</button>
      </div>
    </div>
  </header>

  <!-- FILTER BAR -->
  <section class="filter-bar">
    <div class="filter-inner">
      <div class="filter-tabs">
        <button class="tab active" data-cat="all">Tất cả</button>
        <button class="tab" data-cat="thoi-trang">Thời trang</button>
        <button class="tab" data-cat="giay-dep">Giày dép</button>
        <button class="tab" data-cat="tui-xach">Túi xách</button>
        <button class="tab" data-cat="phu-kien">Phụ kiện</button>
      </div>
      <div class="filter-search">
        <input type="text" id="searchInput" placeholder="Tìm sản phẩm…" />
      </div>
    </div>
  </section>

  <!-- PRODUCT GRID -->
  <main class="product-section">
    <div class="product-grid" id="productGrid"></div>
    <p class="empty-state" id="emptyState" style="display:none">Không tìm thấy sản phẩm nào.</p>
  </main>

  <!-- MODAL THÊM / SỬA SẢN PHẨM -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" id="btnCloseModal">✕</button>
      <h2 class="modal-title" id="modalTitle">Thêm sản phẩm</h2>

      <div class="form-grid">
        <div class="form-group">
          <label>Mã sản phẩm</label>
          <input type="text" id="fMa" placeholder="VD: SP011" />
        </div>
        <div class="form-group">
          <label>Tên sản phẩm</label>
          <input type="text" id="fTen" placeholder="VD: Áo thun oversize" />
        </div>
        <div class="form-group">
          <label>Danh mục</label>
          <select id="fDanhMuc">
            <option value="thoi-trang">Thời trang</option>
            <option value="giay-dep">Giày dép</option>
            <option value="tui-xach">Túi xách</option>
            <option value="phu-kien">Phụ kiện</option>
          </select>
        </div>
        <div class="form-group">
          <label>Đơn giá (₫)</label>
          <input type="number" id="fGia" placeholder="VD: 220000" />
        </div>
        <div class="form-group">
          <label>Số lượng</label>
          <input type="number" id="fSoLuong" placeholder="VD: 85" />
        </div>
        <div class="form-group full">
          <label>URL ảnh sản phẩm</label>
          <input type="text" id="fAnh" placeholder="https://… hoặc img/ao1.jpg" />
        </div>
        <div class="form-group full">
          <label>Nhãn đặc biệt</label>
          <select id="fNhan">
            <option value="">Không có</option>
            <option value="MOI">MỚI</option>
            <option value="HOT">HOT</option>
            <option value="SALE">SALE</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn-cancel" id="btnCancel">Hủy</button>
        <button class="btn-save" id="btnSave">Lưu sản phẩm</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="main.js"></script>
</body>
</html>
